<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RPA Testing Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card glass">
      <div class="logo centered">
        <span class="brand">Antigravity</span>
        <span class="suite">Secure Access</span>
      </div>
      
      <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Please enter your credentials to access the testing suite.</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
        </div>

        <div id="login-error" class="error-message hidden">
          Invalid username or password. Please try again.
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary login-btn">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
